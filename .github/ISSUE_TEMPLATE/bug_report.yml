name: Bug/Fix
description: Relatar um defeito no fluxo normal de desenvolvimento.
labels: ["bug"]
body:
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Onde e quando o problema ocorre; ambiente e condições relevantes.
    validations:
      required: true
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: Qual o comportamento correto esperado após a correção.
    validations:
      required: true
  - type: textarea
    id: descricao
    attributes:
      label: Descrição
      description: Descreva o problema e os passos para reproduzi-lo (resultado atual x resultado esperado).
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de Aceitação
      description: Lista verificável que confirma que o defeito foi corrigido.
    validations:
      required: true
  - type: textarea
    id: observacoes
    attributes:
      label: Observações / Restrições
      description: Logs, evidências, dependências ou restrições relevantes (opcional).
    validations:
      required: false
